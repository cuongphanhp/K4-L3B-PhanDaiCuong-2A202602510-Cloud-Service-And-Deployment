version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cuongphanhp", email = "phancuonghphaui@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fakeredis>=2.21",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
